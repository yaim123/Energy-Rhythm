<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>에너지 리듬 · Energy World</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#05030f;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;font-family:system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;color:#fff}
canvas{display:block;position:fixed;inset:0;width:100%;height:100%}
.ov{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;background:rgba(5,3,15,.8);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);text-align:center;padding:16px;overflow:auto;z-index:10;touch-action:pan-y}
.hidden{display:none!important}
.logo{font-size:clamp(28px,7vw,46px);font-weight:900;letter-spacing:-1px;background:linear-gradient(90deg,#3ee6ff,#ffd23e,#ff3d7f);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 18px rgba(62,230,255,.35))}
.sub{font-size:12px;opacity:.7;margin-top:-6px}
.songs{display:flex;flex-direction:column;gap:6px;width:min(460px,94vw);max-height:36vh;overflow:auto;touch-action:pan-y;padding:2px}
.song{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 14px;border-radius:14px;background:rgba(255,255,255,.05);border:2px solid transparent;cursor:pointer;text-align:left;color:#fff;font:inherit}
.song.sel{border-color:#3ee6ff;background:rgba(62,230,255,.1)}
.song b{font-size:15px}
.song small{display:block;font-size:11px;opacity:.65;margin-top:2px}
.lvls{display:flex;gap:4px;flex-shrink:0}
.lvls i{font-style:normal;font-size:11px;font-weight:800;width:24px;height:22px;line-height:22px;border-radius:6px;background:rgba(255,255,255,.08);text-align:center}
.diffs{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.diff{width:124px;padding:10px 6px;border-radius:14px;border:2px solid rgba(255,255,255,.15);background:rgba(255,255,255,.05);color:#fff;cursor:pointer;font:inherit;transition:.15s}
.diff b{display:block;font-size:15px;letter-spacing:1px}
.diff small{display:block;opacity:.7;font-size:11px;margin-top:2px}
.diff.sel{transform:translateY(-3px)}
.row{display:flex;align-items:center;gap:10px;font-size:14px}
.row span{width:72px;text-align:right;opacity:.8}
.row b{width:64px}
.sbtn{width:34px;height:34px;border-radius:50%;border:none;background:rgba(255,255,255,.12);color:#fff;font-size:20px;cursor:pointer}
.big{padding:13px 42px;border-radius:999px;border:none;font:inherit;font-size:18px;font-weight:800;color:#120a2a;background:linear-gradient(90deg,#3ee6ff,#ffd23e);cursor:pointer;box-shadow:0 0 30px rgba(62,230,255,.4)}
.big.alt{background:rgba(255,255,255,.12);color:#fff;box-shadow:none}
.btns{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.help{font-size:11px;opacity:.6;line-height:1.8}
kbd{display:inline-block;min-width:20px;padding:0 5px;border-radius:5px;background:rgba(255,255,255,.15);font-family:inherit;font-weight:700;margin:0 1px}
#pauseBtn{position:fixed;top:calc(10px + env(safe-area-inset-top));left:10px;width:40px;height:40px;border-radius:12px;border:none;background:rgba(255,255,255,.1);color:#fff;font-size:15px;font-weight:900;cursor:pointer;z-index:5}
.grade{font-size:90px;font-weight:900;line-height:1}
.stats{display:grid;grid-template-columns:auto auto;gap:4px 22px;font-size:15px;text-align:left}
.stats span:nth-child(odd){opacity:.7}
.badge{font-weight:900;letter-spacing:2px;color:#ffd23e;min-height:1.2em}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<button id="pauseBtn" class="hidden">Ⅱ</button>

<div id="titleOv" class="ov">
  <div class="logo">⚡ 에너지 리듬</div>
  <div class="sub">ENERGY RHYTHM · 클래식 · 민요 · 캐럴 · 오리지널 22곡</div>
  <div id="songs" class="songs"></div>
  <div id="diffs" class="diffs"></div>
  <button id="startBtn" class="big">시작하기</button>
  <div class="help">PC <kbd>D</kbd><kbd>F</kbd><kbd>J</kbd><kbd>K</kbd> · 모바일은 레인 터치 · <kbd>Esc</kbd> 일시정지<br>⚡ 에너지 게이지가 0이 되면 게임 오버 · 노트가 없을 때 헛누르면 게이지가 깎여요</div>
</div>

<div id="pauseOv" class="ov hidden">
  <div class="logo" style="font-size:40px">일시정지</div>
  <div class="btns">
    <button class="big" data-a="resume">계속하기</button>
    <button class="big alt" data-a="retry">다시 하기</button>
    <button class="big alt" data-a="menu">곡 선택</button>
  </div>
</div>

<div id="resultOv" class="ov hidden">
  <div id="rSong" style="font-size:18px;font-weight:800"></div>
  <div id="rDiff" style="font-weight:800;letter-spacing:2px;margin-top:-8px"></div>
  <div id="rGrade" class="grade"></div>
  <div id="rBadge" class="badge"></div>
  <div id="rScore" style="font-size:30px;font-weight:800"></div>
  <div class="stats" id="rStats"></div>
  <div class="btns">
    <button class="big" data-a="retry">다시 하기</button>
    <button class="big alt" data-a="menu">곡 선택</button>
  </div>
</div>

<script>
//SONG-START
/* ---------- 비창 오버드라이브 (원래 곡) ---------- */

const SCALE = [0, 2, 3, 5, 7, 8, 11]; // C harmonic minor
const CH = { Cm:[0,3,7], G:[7,11,2], G7:[7,11,2,5], Ab:[8,0,3], Fm:[5,8,0] };
const ARPL = [0,2,1,3,0,2,1,3,2,0,3,1,2,0,3,1];

// 비창 3악장 론도 주제를 바탕으로 한 8마디 선율 [박, MIDI, 길이(박)]
const THEME = [
  [0,72,2],[2,74,1],[3,75,1],
  [4,74,1],[5,72,1],[6,71,1],[7,72,1],
  [8,74,2],[10,67,1],[11,68,1],
  [12,67,1],[13,65,1],[14,63,1],[15,62,1],
  [16,63,1],[17,65,1],[18,67,1],[19,68,1],
  [20,67,2],[22,72,1],[23,75,1],
  [24,74,1],[25,72,1],[26,71,1],[27,74,1],
  [28,72,3],[31,67,1]
];
const THEME_H = ['Cm','G','G','Cm','Ab','Cm','G','Cm'];

function degToMidi(deg, base) { const o = Math.floor(deg / 7), i = ((deg % 7) + 7) % 7; return base + 12 * o + SCALE[i]; }
function midiToDeg(m) {
  const o = Math.floor((m - 60) / 12), pc = (((m - 60) % 12) + 12) % 12;
  let i = SCALE.indexOf(pc);
  if (i < 0) { let bd = 99; SCALE.forEach((s, k) => { const d = Math.abs(s - pc); if (d < bd) { bd = d; i = k; } }); }
  return o * 7 + i;
}
const laneOfPitch = m => ((midiToDeg(m) % 4) + 4) % 4;
const voice = name => CH[name].map(pc => 60 + pc).sort((a, b) => a - b);

function buildPathetique() {
  const ev = [], ch = [];
  const hit = (i, t, v = 1) => ev.push({ t, i, v });
  let lastRunLane = -1;

  function arp(bar, name, lvlMap, vel) {
    const v = voice(name).slice(0, 3);
    const pat = [v[0], v[2], v[1], v[2], v[0] + 12, v[2], v[1], v[2]];
    for (let i = 0; i < 16; i++) {
      const t = bar * 4 + i / 4;
      ev.push({ t, i: 'arp', m: pat[i % 8], v: vel });
      const l = lvlMap[i % 4];
      if (l < 9) ch.push({ t, lane: ARPL[i], len: 0, lvl: l });
    }
  }
  function bass(bar, name, style) {
    const r = 36 + CH[name][0], s = bar * 4;
    if (style === 'eighth') for (let k = 0; k < 8; k++) ev.push({ t: s + k / 2, i: 'bass', m: k % 2 ? r + 12 : r });
    else ev.push({ t: s, i: 'bassL', m: r, d: 4 });
  }
  function drums(bar, style) {
    const s = bar * 4;
    if (style === 'kick') { for (let k = 0; k < 4; k++) hit('kick', s + k); return; }
    if (style === 'half') { hit('kick', s); hit('kick', s + 2.5); hit('snare', s + 2); for (let k = 0; k < 8; k++) hit('hat', s + k / 2, k % 2 ? 1 : .5); return; }
    for (let k = 0; k < 4; k++) { hit('kick', s + k); if (k % 2) hit('snare', s + k); hit('hat', s + k + .5); }
    if (style === 'full') for (let k = 0; k < 4; k++) { hit('hat', s + k + .25, .6); hit('hat', s + k + .75, .6); }
    if (style === 'roll') for (let i = 0; i < 16; i++) hit('snare', s + i / 4, .3 + .7 * i / 16);
  }
  function melody(start, notes, o = {}) {
    const sc = o.stretch || 1, out = [];
    for (const [bt, m, d] of notes) {
      const t = start + bt * sc, dur = d * sc;
      ev.push({ t, i: 'lead', m, d: dur });
      if (o.dbl) ev.push({ t, i: 'lead2', m: m + 12, d: dur });
      const lane = laneOfPitch(m), len = dur >= 2 ? dur - .5 : 0;
      ch.push({ t, lane, len, lvl: 0 });
      out.push({ t, end: t + dur, lane });
      if (o.mirror && bt % 2 === 0) ch.push({ t, lane: 3 - lane, len, lvl: 2 });
    }
    return out;
  }
  function run(bar, name, dir, jump) {
    const d0 = midiToDeg(60 + CH[name][0]);
    const base = d0 >= 4 ? 60 : 72;
    for (let i = 0; i < 16; i++) {
      const k = i < 8 ? i : 16 - i;
      const deg = dir === 'up' ? d0 + k : d0 + 8 - k;
      const t = bar * 4 + i / 4;
      ev.push({ t, i: 'run', m: degToMidi(deg, base) });
      let lane = dir === 'up' ? (i < 8 ? i % 4 : 3 - ((i + 1) % 4)) : (i < 8 ? 3 - (i % 4) : (i + 1) % 4);
      if (lane === lastRunLane) lane = (lane + 2) % 4;
      lastRunLane = lane;
      ch.push({ t, lane, len: 0, lvl: [0, 2, 1, 2][i % 4] });
      if (jump && i % 2 === 0) ch.push({ t, lane: 3 - lane, len: 0, lvl: 2 });
    }
  }

  // INTRO (0-3)
  const IN_H = ['Cm', 'Ab', 'Fm', 'G'];
  hit('crash', 0);
  for (let b = 0; b < 4; b++) { arp(b, IN_H[b], [0, 2, 1, 2], .05); bass(b, IN_H[b], 'eighth'); drums(b, b === 0 ? 'kick' : 'four'); }
  ev.push({ t: 15, i: 'lead', m: 67, d: 1 }); ch.push({ t: 15, lane: laneOfPitch(67), len: 0, lvl: 0 });

  // A1 (4-11)
  hit('crash', 16);
  melody(16, THEME);
  for (let j = 0; j < 8; j++) { arp(4 + j, THEME_H[j], [9, 9, 1, 2], .035); bass(4 + j, THEME_H[j], 'eighth'); drums(4 + j, 'four'); }

  // A2 (12-19)
  hit('crash', 48);
  melody(48, THEME);
  for (let j = 0; j < 8; j++) { arp(12 + j, THEME_H[j], [2, 2, 1, 2], .045); bass(12 + j, THEME_H[j], 'eighth'); drums(12 + j, 'full'); }

  // B: 스케일 런 (20-27)
  hit('crash', 80);
  const B_H = ['Cm', 'Cm', 'Ab', 'Ab', 'Fm', 'Fm', 'G', 'G'];
  for (let j = 0; j < 8; j++) { run(20 + j, B_H[j], j % 2 ? 'down' : 'up', j >= 6); bass(20 + j, B_H[j], 'eighth'); drums(20 + j, j >= 6 ? 'roll' : 'four'); }

  // C: 롱노트 구간 (28-35)
  hit('crash', 112);
  const C_H = ['Cm', 'Cm', 'G', 'G', 'G', 'G', 'Cm', 'G'];
  const cm = melody(112, THEME.filter(n => n[0] < 16), { stretch: 2 });
  for (let j = 0; j < 8; j++) {
    const bar = 28 + j;
    ev.push({ t: bar * 4, i: 'pad', ch: voice(C_H[j]).slice(0, 3), d: 4 });
    bass(bar, C_H[j], 'whole'); drums(bar, 'half');
    for (let k = 0; k < 4; k++) {
      const t = bar * 4 + k + .5;
      const cur = cm.find(n => t >= n.t && t < n.end);
      const cl = cur ? cur.lane : 1;
      ch.push({ t, lane: (cl + 2) % 4, len: 0, lvl: 2 });
      if (k % 2) ch.push({ t: t + .5, lane: (cl + 1) % 4, len: 0, lvl: 1 });
    }
  }
  ev.push({ t: 143, i: 'lead', m: 67, d: 1 }); ch.push({ t: 143, lane: laneOfPitch(67), len: 0, lvl: 0 });

  // A3 클라이맥스 (36-43)
  hit('crash', 144);
  melody(144, THEME, { dbl: true, mirror: true });
  for (let j = 0; j < 8; j++) { arp(36 + j, THEME_H[j], [2, 2, 1, 2], .045); bass(36 + j, THEME_H[j], 'eighth'); drums(36 + j, 'full'); }

  // OUTRO (44-47)
  hit('crash', 176);
  run(44, 'G', 'down', false); bass(44, 'G', 'eighth'); drums(44, 'roll');
  const g7 = voice('G7');
  for (let i = 0; i < 16; i++) {
    const t = 180 + i / 4;
    ev.push({ t, i: 'stab', ch: g7 });
    if (i % 4 === 0) hit('kick', t);
    hit('snare', t, .4 + .6 * i / 16);
    const lvl = i % 4 === 0 ? 0 : i % 2 === 0 ? 1 : 2;
    const pair = i % 2 ? [2, 3] : [0, 1];
    pair.forEach(l => ch.push({ t, lane: l, len: 0, lvl }));
  }
  ev.push({ t: 180, i: 'bassL', m: 43, d: 4 });
  const cmv = voice('Cm');
  [184, 185.5, 187].forEach(t => {
    hit('crash', t); hit('kick', t);
    ev.push({ t, i: 'stab', ch: cmv.concat([72]) }); ev.push({ t, i: 'bass', m: 36 });
    ch.push({ t, lane: 0, len: 0, lvl: 0 }, { t, lane: 3, len: 0, lvl: 0 }, { t, lane: 1, len: 0, lvl: 1 }, { t, lane: 2, len: 0, lvl: 2 });
  });
  hit('crash', 188); hit('kick', 188);
  ev.push({ t: 188, i: 'lead', m: 72, d: 4 }, { t: 188, i: 'lead2', m: 84, d: 4 }, { t: 188, i: 'pad', ch: cmv, d: 4 }, { t: 188, i: 'bassL', m: 36, d: 4 });
  ch.push({ t: 188, lane: 0, len: 3, lvl: 0 }, { t: 188, lane: 3, len: 3, lvl: 0 }, { t: 188, lane: 1, len: 3, lvl: 1 }, { t: 188, lane: 2, len: 3, lvl: 2 });

  ev.sort((a, b) => a.t - b.t);
  return { ev, ch, beats: 192 };
}



/* ---------- 공통 작곡 도구 ---------- */
const PCN = { C:0, D:2, E:4, F:5, G:7, A:9, B:11 };
function nm(s) {
  const m = /^([A-G])(#|b)?(-?\d)$/.exec(s);
  if (!m) throw new Error('bad note ' + s);
  return (+m[3] + 1) * 12 + PCN[m[1]] + (m[2] === '#' ? 1 : m[2] === 'b' ? -1 : 0);
}
function S(str, unit) {
  return str.trim().split(/\s+/).filter(x => x && x !== '|').map(tok => {
    const [n, mul] = tok.split(':');
    return [n === 'R' ? null : nm(n), (mul ? +mul : 1) * unit];
  });
}
const rep = (n, k) => Array(k).fill(n).join(' ');
const tr = (arr, s) => arr.map(([m, d]) => [m === null ? null : m + s, d]);
function chordPcs(name) {
  const m = /^([A-G])(#|b)?(m7|m|7|dim)?$/.exec(name);
  const r = (PCN[m[1]] + (m[2] === '#' ? 1 : m[2] === 'b' ? -1 : 0) + 12) % 12, q = m[3] || '';
  const iv = q === 'm' ? [0,3,7] : q === '7' ? [0,4,7,10] : q === 'm7' ? [0,3,7,10] : q === 'dim' ? [0,3,6] : [0,4,7];
  return iv.map(x => (r + x) % 12);
}
const voiceOf = pcs => pcs.slice(0, 3).map(pc => 60 + pc).sort((a, b) => a - b);
function brk(name, base) {
  const pcs = chordPcs(name).slice(0, 3), asc = [];
  for (let m = base; asc.length < 8; m++) if (pcs.includes(m % 12)) asc.push(m);
  return [0,1,2,3,4,5,6,7,6,5,4,3,2,1,0,1].map(i => [asc[i], .25]);
}
function accomp(ev, ch, type, bs, bb, pcs, lvlMap) {
  const v = voiceOf(pcs);
  if (type === 'arp16') {
    const pat = [v[0], v[2], v[1], v[2], v[0] + 12, v[2], v[1], v[2]], n = Math.round(bb * 4);
    for (let i = 0; i < n; i++) {
      const t = bs + i / 4;
      ev.push({ t, i: 'arp', m: pat[i % 8], v: .04 });
      if (lvlMap) { const l = lvlMap[i % 4]; if (l < 9) ch.push({ t, lane: ARPL[i % 16], len: 0, lvl: l }); }
    }
  } else if (type === 'oom') { for (let k = 0; k < Math.floor(bb); k++) ev.push({ t: bs + k + .5, i: 'stab', ch: v, v: .6 }); }
  else if (type === 'pad') ev.push({ t: bs, i: 'pad', ch: v, d: bb });
  else if (type === 'carol') { for (let k = 0; k < bb / 3; k++) [[70, 0], [69, 1], [70, 1.5], [67, 2]].forEach(([m, o]) => ev.push({ t: bs + k * 3 + o, i: 'arp', m, v: .05 })); }
  else if (type === 'six') { for (let g = 0; g < bb / 1.5; g++) { ev.push({ t: bs + g * 1.5 + .5, i: 'stab', ch: v, v: .5 }, { t: bs + g * 1.5 + 1, i: 'stab', ch: v, v: .5 }); } }
}
function bassF(ev, type, bs, bb, pcs) {
  let r = 36 + pcs[0]; if (r > 45) r -= 12;
  const f = r + ((pcs[2] - pcs[0] + 12) % 12);
  if (type === 'eighth') for (let k = 0; k < Math.round(bb * 2); k++) ev.push({ t: bs + k / 2, i: 'bass', m: k % 2 ? r + 12 : r });
  else if (type === 'oom') for (let k = 0; k < Math.floor(bb); k++) ev.push({ t: bs + k, i: 'bass', m: k % 2 ? f : r });
  else if (type === 'whole') ev.push({ t: bs, i: 'bassL', m: r, d: bb });
  else if (type === 'six') for (let g = 0; g < bb / 1.5; g++) ev.push({ t: bs + g * 1.5, i: 'bass', m: g % 2 ? f : r });
}
function drumF(hit, type, bs, bb) {
  if (!type || type === 'none') return;
  const nb = Math.floor(bb);
  if (type === 'kick') { for (let k = 0; k < nb; k++) hit('kick', bs + k); return; }
  if (type === 'six' || type === 'sixfull') { for (let g = 0; g < bb / 1.5; g++) { const s = bs + g * 1.5; hit(g % 2 ? 'snare' : 'kick', s); hit('hat', s + .5, .7); hit('hat', s + 1, .7); if (type === 'sixfull') hit('kick', s + 1, .6); } return; }
  if (type === 'soft') { hit('kick', bs, .7); for (let k = 0; k < Math.round(bb * 2); k++) hit('hat', bs + k / 2, k % 2 ? .5 : .3); if (bb >= 1.5) hit('snare', bs + 1, .45); return; }
  for (let k = 0; k < nb; k++) { hit('kick', bs + k); if (k % 2) hit('snare', bs + k); hit('hat', bs + k + .5); }
  if (type === 'full') for (let k = 0; k < nb; k++) { hit('hat', bs + k + .25, .6); hit('hat', bs + k + .75, .6); }
  if (type === 'roll') for (let i = 0; i < nb * 4; i++) hit('snare', bs + i / 4, .3 + .7 * i / (nb * 4));
}
function endChord(ev, ch, hit, t, pcs, beats) {
  const v = voiceOf(pcs); let r = 36 + pcs[0]; if (r > 45) r -= 12;
  hit('crash', t); hit('kick', t);
  ev.push({ t, i: 'lead', m: v[0] + 12, d: beats }, { t, i: 'lead2', m: v[0] + 24, d: beats }, { t, i: 'pad', ch: v, d: beats }, { t, i: 'bassL', m: r, d: beats });
  const len = Math.max(1, beats - 1);
  ch.push({ t, lane: 0, len, lvl: 0 }, { t, lane: 3, len, lvl: 0 }, { t, lane: 1, len, lvl: 1 }, { t, lane: 2, len, lvl: 2 });
}
const WARN = [];
function makeSong(spec) {
  const ev = [], ch = [], E = 1e-6;
  let t0 = 0, lane = 0, prev = null;
  const hit = (i, t, v = 1) => ev.push({ t, i, v });
  const bb = spec.barBeats || 4;
  spec.sections.forEach((sec, si) => {
    const bars = sec.chords.length;
    if (sec.crash) hit('crash', t0);
    if (sec.mel) {
      let t = t0;
      for (const [m, d] of sec.mel) {
        if (m !== null) {
          const mm = m + (sec.oct || 0);
          ev.push({ t, i: sec.lead || spec.lead || 'lead', m: mm, d });
          if (sec.dbl) ev.push({ t, i: 'lead2', m: mm + 12, d });
          if (prev !== null) lane = mm > prev ? (lane + 1) % 4 : mm < prev ? (lane + 3) % 4 : (lane + 2) % 4;
          prev = mm;
          const rel = t - t0, inBar = rel - Math.floor(rel / bb + E) * bb, ph = inBar - Math.floor(inBar + E);
          const lvl = Math.abs(ph) < E ? 0 : Math.abs(ph - .5) < E ? 1 : 2;

function tempoFns(b0, b1, beats) {
  const k = (b1 - b0) / beats;
  if (Math.abs(k) < 1e-9) return { b2s: b => b * 60 / b0, s2b: s => s * b0 / 60 };
  return { b2s: b => 60 / k * Math.log((b0 + k * b) / b0), s2b: s => b0 * (Math.exp(k * s / 60) - 1) / k };
}
function chartFor(raw, level, b2s) {
  const src = raw.slice().sort((a, b) => a.t - b.t || a.lvl - b.lvl);
  const out = [], seen = new Set(), holdEnd = [-9, -9, -9, -9];
  for (const n of src) {
    if (n.lvl > level) continue;
    const key = Math.round(n.t * 100) + '_' + n.lane;
    if (seen.has(key)) continue;
    if (n.t < holdEnd[n.lane] + .24) continue;
    seen.add(key);
    const time = b2s(n.t), end = b2s(n.t + n.len);
    out.push({ time, lane: n.lane, len: end - time, end });
    if (n.len > 0) holdEnd[n.lane] = n.t + n.len;
  }
  return out;
}

  for (const e of data.ev) { e.ts = tf.b2s(e.t); e.ds = e.d != null ? tf.b2s(e.t + e.d) - e.ts : 0; }
  s.ev = data.ev; s.beats = data.beats; s.b2s = tf.b2s; s.s2b = tf.s2b;
  s.end = tf.b2s(data.beats); s.barBeats = (s.spec && s.spec.barBeats) || 4;
  // 난이도별 채보를 미리 전부 확정(초 단위 시간·레인·롱노트 길이)해 두고, 플레이 중에는 읽기만 한다
  s.charts = [0, 1, 2].map(l => chartFor(data.ch, l, tf.b2s));

}

  e.preventDefault();
  if (e.repeat) return;
  if (state === 'play') press(l, songTimeAt(evMs(e)));
});
addEventListener('keyup', e => { const l = KEYS[e.code]; if (l !== undefined) releaseLane(l, songTimeAt(evMs(e))); });

// 터치/마우스: 손가락마다 어느 레인을 눌렀는지 기억(멀티터치 지원)
const ptrs = new Map();
const laneAt = x => { const v = (x - colX) / laneW; return v > 0 ? Math.min(3, Math.floor(v)) : 0; };
function ptrDown(id, x, ms) {
  if (state !== 'play') return;
  const t = songTimeAt(ms);
  if (ptrs.has(id)) releaseLane(ptrs.get(id), t); // 떼는 이벤트를 놓친 경우 정리
  const l = laneAt(x);
  ptrs.set(id, l); press(l, t);
}
function ptrUp(id, ms) {
  if (!ptrs.has(id)) return;
  const l = ptrs.get(id); ptrs.delete(id);
  releaseLane(l, songTimeAt(ms));
}
if (window.PointerEvent) {
  cv.addEventListener('pointerdown', e => {
    if (e.pointerType === 'mouse' && e.button !== 0) return;
    e.preventDefault();
    ptrDown(e.pointerId, e.clientX, evMs(e));
  });
  const up = e => ptrUp(e.pointerId, evMs(e));
  addEventListener('pointerup', up); addEventListener('pointercancel', up);
} else {
  // 포인터 이벤트가 없는 구형 브라우저용 터치 처리
  cv.addEventListener('touchstart', e => { const ms = evMs(e); for (const tc of e.changedTouches) ptrDown('t' + tc.identifier, tc.clientX, ms); }, { passive: false });
  const tend = e => { const ms = evMs(e); for (const tc of e.changedTouches) ptrUp('t' + tc.identifier, ms); };
  addEventListener('touchend', tend); addEventListener('touchcancel', tend);
  cv.addEventListener('mousedown', e => ptrDown('m', e.clientX, evMs(e)));
  addEventListener('mouseup', e => ptrUp('m', evMs(e)));
}
// iOS/안드로이드의 길게 누르기·돋보기·스크롤·더블탭 확대 같은 브라우저 제스처가 터치를 가로채지 않도록 막는다
['touchstart', 'touchmove', 'touchend'].forEach(ev => cv.addEventListener(ev, e => { if (e.cancelable) e.preventDefault(); }, { passive: false }));
addEventListener('contextmenu', e => e.preventDefault());
document.addEventListener('visibilitychange', () => { if (document.hidden) pause(); });
addEventListener('pagehide', pause);
$('pauseBtn').onclick = () => { pause(); $('pauseBtn').blur(); };
$('startBtn').onclick = () => { if (state === 'title') startGame(); };
document.querySelectorAll('[data-a]').forEach(b => b.onclick = () => {
  const a = b.dataset.a;
  if (a === 'resume') resume();
  if (a === 'retry' && (state === 'pause' || state === 'result')) startGame();
  if (a === 'menu') toMenu();
  else renderTitle();
});
function selectSong(i) { songIdx = i; cur = prepareSong(SONGS[i]); store.set('song', cur.id); renderTitle(); prerender(); }
function renderTitle() {
  prepareSong(cur);
  $('songs').innerHTML = SONGS.map((s, i) => `<button class="song${i === songIdx ? ' sel' : ''}" data-s="${i}"><div><b>${s.title}</b><small>${s.comp} · ${s.bpm1 ? s.bpm0 + '→' + s.bpm1 : s.bpm0} BPM</small></div><div class="lvls">${s.lv.map((v, d) => `<i style="color:${DIFFS[d].color}">${v}</i>`).join('')}</div></button>`).join('');
  document.querySelectorAll('.song').forEach(b => b.onclick = () => selectSong(+b.dataset.s));
  $('diffs').innerHTML = DIFFS.map((d, i) => `<button class="diff${i === diff ? ' sel' : ''}" data-d="${i}" style="${i === diff ? `border-color:${d.color};box-shadow:0 0 20px ${d.color}66;` : ''}"><b style="color:${d.color}">${d.name}</b><small>Lv.${cur.lv[i]} · ${cur.charts[i].length}노트</small><small>최고 ${fmt(bestOf(cur, i))}</small></button>`).join('');
  document.querySelectorAll('.diff').forEach(b => b.onclick = () => { diff = +b.dataset.d; store.set('diff', diff); renderTitle(); });
  const sel = document.querySelector('.song.sel'); if (sel && sel.scrollIntoView) sel.scrollIntoView({ block: 'nearest' });
}
renderTitle();
prerender();

/* ================= RENDER ================= */
function hexA(h, a) { const n = parseInt(h.slice(1), 16); return `rgba(${n >> 16},${(n >> 8) & 255},${n & 255},${a})`; }
function fmt(n) { return String(n).replace(/\B(?=(\d{3})+(?!\d))/g, ','); }
function rr(x, y, w, h, r) { g.beginPath(); g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r); g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath(); g.fill(); }
const MAX_PARTICLES = 220;
function burst(lane, k) {
  const x = colX + (lane + .5) * laneW, n = k === 'P' ? 12 : 7;
  ringFx[lane] = 1;
  for (let i = 0; i < n && particles.length < MAX_PARTICLES; i++) particles.push({ x, y: judgeY, vx: (Math.random() - .5) * 7, vy: -Math.random() * 7 - 2, life: 1, c: k === 'P' ? (Math.random() < .5 ? '#fff6b0' : LC[lane]) : LC[lane] });
}
let scoreW = -1, scoreTxt = '0';
let lastFrame = performance.now();
function frame(now) {
  const dt = Math.min(50, Math.max(0, now - lastFrame)) / 16.67; lastFrame = now;
  if (state === 'play') { syncClock(now); st = songTimeAt(now); update(st); }
  const active = state !== 'title' && state !== 'loading';
  const t = active ? st : now / 1000;
  g.fillStyle = '#05030f'; g.fillRect(0, 0, W, H);
  let pulse = 0;
  if (active && t > 0 && t < cur.end) { const b = cur.s2b(t); pulse = Math.pow(1 - (b - Math.floor(b)), 3); }
  const energy = S_ && active ? Math.min(S_.combo / 150, 1) : .3;
  const grd = g.createRadialGradient(W / 2, H * .38, 0, W / 2, H * .38, Math.max(W, H) * .65);
  grd.addColorStop(0, `rgba(120,60,255,${(.16 + .32 * energy + .14 * pulse).toFixed(3)})`);
  grd.addColorStop(.45, `rgba(40,180,255,${(.05 + .14 * energy).toFixed(3)})`);
  grd.addColorStop(1, 'rgba(0,0,0,0)');
  g.fillStyle = grd; g.fillRect(0, 0, W, H);
  const drift = active ? Math.max(t, 0) * 40 : now / 1000 * 8;
  g.fillStyle = '#fff';
  for (const s of STARS) {
    g.globalAlpha = (.3 + .7 * Math.abs(Math.sin(now / 1000 * s.tw + s.ph))) * s.b;
    g.fillRect(s.x * W, (s.y * H + drift * s.sp) % H, s.r, s.r);
  }
  g.globalAlpha = 1;
  if (active && lanesQ) drawField(t, dt, pulse);
  requestAnimationFrame(frame);
}
function drawField(t, dt, pulse) {
  const pps = H * .18 * speed;
  g.fillStyle = 'rgba(8,6,24,.8)'; g.fillRect(colX, 0, colW, H);
  for (let l = 0; l < 4; l++) {
    const a = Math.max(laneFlash[l], laneDown[l] > 0 ? .55 : 0);
    if (a > .01) { g.globalAlpha = a; g.fillStyle = laneGrad[l]; g.fillRect(colX + l * laneW, 0, laneW, judgeY); }
    laneFlash[l] *= Math.pow(.85, dt);
    if (laneErr[l] > .01) {
      g.globalAlpha = .28 * laneErr[l]; g.fillStyle = '#ff3c5a'; g.fillRect(colX + l * laneW, judgeY - H * .25, laneW, H * .25);
      laneErr[l] *= Math.pow(.82, dt);
    }
  }
  g.globalAlpha = 1;
  g.fillStyle = 'rgba(255,255,255,.07)';
  for (let l = 0; l <= 4; l++) g.fillRect(colX + l * laneW - .5, 0, 1, H);
  // 마디선
  const bb = cur.barBeats, nBars = Math.floor(cur.beats / bb);
  g.fillStyle = 'rgba(255,255,255,.12)';
  for (let b = Math.max(0, Math.floor(cur.s2b(Math.max(t, 0)) / bb)); b <= nBars; b++) {
    const y = judgeY - (cur.b2s(b * bb) - t) * pps;
    if (y < -5) break;
    if (y <= judgeY) g.fillRect(colX, y, colW, 1);
  }
  // 노트
  const nh = Math.max(14, Math.min(22, laneW * .2));
  for (let l = 0; l < 4; l++) {
    const q = lanesQ[l], x = colX + l * laneW + 5, w = laneW - 10;
    for (let i = laneHead[l]; i < q.length; i++) {
      const n = q[i], y = judgeY - (n.time - t) * pps;
      if (y < -nh - 10) break;
      if (n.done) continue;
      const holding = hold[l] === n;
      if (n.len > 0) {
        const ye = judgeY - (n.end - t) * pps, yh = holding ? judgeY : y;
        g.fillStyle = LC[l];
        g.globalAlpha = holding ? .55 : .3; g.fillRect(x + w * .12, ye, w * .76, yh - ye);
        g.globalAlpha = .9; g.fillRect(x + w * .12, ye - 3, w * .76, 6);
        g.globalAlpha = 1;
        drawNote(x, yh, w, nh, l);
        if (holding && particles.length < MAX_PARTICLES && Math.random() < .5) particles.push({ x: x + Math.random() * w, y: judgeY, vx: (Math.random() - .5) * 2, vy: -Math.random() * 4 - 1, life: .7, c: LC[l] });
      } else drawNote(x, y, w, nh, l);
    }
  }
  // 판정선
  g.fillStyle = judgeGrad; g.globalAlpha = .75 + .25 * pulse; g.fillRect(colX, judgeY - 2, colW, 4); g.globalAlpha = 1;
  g.fillStyle = 'rgba(0,0,0,.45)'; g.fillRect(colX, judgeY + 2, colW, H - judgeY);
  g.font = '700 16px system-ui'; g.textAlign = 'center'; g.lineWidth = 3;
  for (let l = 0; l < 4; l++) {
    const cx = colX + (l + .5) * laneW;
    if (laneDown[l] > 0) { g.fillStyle = LC[l]; g.globalAlpha = .25; g.fillRect(colX + l * laneW, judgeY + 2, laneW, H - judgeY); g.globalAlpha = 1; }
    if (ringFx[l] > .01) {
      g.strokeStyle = LC[l]; g.globalAlpha = ringFx[l];
      g.beginPath(); g.arc(cx, judgeY, laneW * (.55 - ringFx[l] * .3), 0, Math.PI * 2); g.stroke();
      g.globalAlpha = 1;
      ringFx[l] *= Math.pow(.86, dt);
    }
    if (!isTouch) { g.fillStyle = 'rgba(255,255,255,.4)'; g.fillText('DFJK'[l], cx, judgeY + 34); }
  }
  // 파티클 (배열 재배치 없이 끝 원소와 바꿔 제거)
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx * dt; p.y += p.vy * dt; p.vy += .25 * dt; p.life -= .035 * dt;
    if (p.life <= 0) { particles[i] = particles[particles.length - 1]; particles.pop(); continue; }
    g.globalAlpha = p.life; g.fillStyle = p.c; g.fillRect(p.x - 2, p.y - 2, 4, 4);
  }
  g.globalAlpha = 1;
  // 판정 & 콤보
  g.textAlign = 'center';
  if (judgeFx) {
    const age = performance.now() - judgeFx.t;
    if (age < 500) {
      const [txt, col] = JTXT[judgeFx.k], sc = 1 + .35 * Math.max(0, 1 - age / 90);
      g.globalAlpha = age > 300 ? 1 - (age - 300) / 200 : 1;
      g.fillStyle = col; g.font = `900 ${Math.round(30 * sc)}px system-ui`;
      g.fillText(txt, W / 2, judgeY - H * .26);
      g.globalAlpha = 1;
    }
  }
  if (S_.combo >= 3) {
    g.fillStyle = 'rgba(255,255,255,.9)'; g.font = '900 52px system-ui';
    g.fillText(S_.combo, W / 2, judgeY - H * .36);
    g.font = '700 13px system-ui'; g.fillStyle = 'rgba(255,255,255,.55)';
    g.fillText('COMBO', W / 2, judgeY - H * .36 + 20);
  }
  if (t < 0) {
    g.font = '900 64px system-ui'; g.fillStyle = 'rgba(255,255,255,.85)'; g.fillText(Math.ceil(-t), W / 2, H * .4);
    g.font = '800 18px system-ui'; g.fillStyle = 'rgba(255,255,255,.7)'; g.fillText(cur.title, W / 2, H * .4 + 34);
  }
  // 에너지 게이지
  const gv = S_.gauge / 100, gx = colX + colW + 14 + 12 <= W ? colX + colW + 6 : colX + colW - 14;
  const gTop = H * .14, gH = judgeY - gTop;
  g.fillStyle = 'rgba(255,255,255,.1)'; rr(gx, gTop, 10, gH, 5);
  const gcol = gv > .5 ? '#5effa1' : gv > .25 ? '#ffd23e' : '#ff4d6d';
  if (gv > 0) { g.fillStyle = gcol; g.globalAlpha = gv <= .25 ? .6 + .4 * Math.abs(Math.sin(performance.now() / 120)) : 1; rr(gx, gTop + gH * (1 - gv), 10, gH * gv, 5); g.globalAlpha = 1; }
  g.fillStyle = 'rgba(255,255,255,.6)'; g.font = '800 10px system-ui'; g.textAlign = 'center'; g.fillText('⚡' + Math.round(S_.gauge), gx + 5, gTop - 8);
  if (gv <= .25 && state === 'play') {
    g.globalAlpha = .12 + .1 * Math.abs(Math.sin(performance.now() / 150));
    g.fillStyle = dangerGrad; g.fillRect(0, 0, W, H); g.globalAlpha = 1;
  }
  if (state === 'over') {
    const age = Math.min(1, (performance.now() - overAt) / 400);
    g.fillStyle = `rgba(20,0,10,${.55 * age})`; g.fillRect(0, 0, W, H);
    g.textAlign = 'center'; g.globalAlpha = age; g.fillStyle = '#ff4d6d'; g.font = `900 ${Math.round(40 + 16 * age)}px system-ui`;
    g.fillText('GAME OVER', W / 2, H * .42); g.globalAlpha = 1;
  }
  // HUD (점수 문자열은 점수가 바뀔 때만 다시 만든다)
  if (S_.w !== scoreW) { scoreW = S_.w; scoreTxt = fmt(Math.round(S_.w / S_.total * 1e6)); }
  g.fillStyle = 'rgba(255,255,255,.12)'; g.fillRect(0, 0, W, 4);
  g.fillStyle = DIFFS[diff].color; g.fillRect(0, 0, W * Math.max(0, Math.min(1, t / cur.end)), 4);
  g.textAlign = 'right'; g.fillStyle = '#fff'; g.font = '800 22px system-ui';
  g.fillText(scoreTxt, W - 14, 38);
  g.font = '800 12px system-ui'; g.fillStyle = DIFFS[diff].color;
  g.fillText(`${DIFFS[diff].name} ${cur.lv[diff]}`, W - 14, 56);
}
function drawNote(x, y, w, h, l) {
  g.fillStyle = LC[l];
  g.globalAlpha = .35; rr(x - 3, y - h / 2 - 3, w + 6, h + 6, 8);
  g.globalAlpha = 1; rr(x, y - h / 2, w, h, 6);
  g.fillStyle = 'rgba(255,255,255,.85)'; g.fillRect(x + 6, y - 1.5, w - 12, 3);
}
requestAnimationFrame(frame);
</script>
</body>
