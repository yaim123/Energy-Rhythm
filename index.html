<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>에너지 리듬 · Energy World</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#05030f;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;font-family:system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;color:#fff}
canvas{display:block;position:fixed;inset:0;width:100%;height:100%}
/* 매 프레임 다시 그릴 필요 없는 것들은 따로 층을 나눠 브라우저(GPU)가 합성만 하게 한다 */
#bgBase,#bgGlow,#danger{position:fixed;inset:0;pointer-events:none}
#bgBase{background:radial-gradient(circle max(65vw,65vh) at 50% 38%,rgba(120,60,255,.16) 0%,rgba(40,180,255,.05) 45%,rgba(0,0,0,0) 100%)}
#bgGlow{background:radial-gradient(circle max(65vw,65vh) at 50% 38%,rgba(120,60,255,.46) 0%,rgba(40,180,255,.14) 45%,rgba(0,0,0,0) 100%);opacity:.2;will-change:opacity}
canvas.stars{inset:auto;top:0;left:0;height:200%;pointer-events:none;will-change:transform}
#st1{animation:tw 3.1s ease-in-out infinite alternate}
#st2{animation:tw 2.3s ease-in-out infinite alternate-reverse}
@keyframes tw{from{opacity:.55}to{opacity:1}}
#field{pointer-events:none}
#danger{background:linear-gradient(rgba(255,40,80,1),rgba(255,40,80,0) 50%,rgba(255,40,80,1));opacity:0}
#danger.on{animation:dg .47s ease-in-out infinite alternate}
@keyframes dg{from{opacity:.12}to{opacity:.22}}
/* 게임 캔버스는 가운데 플레이 영역 크기만큼만 만든다(위치·폭은 JS가 지정) */
#cv,#field{right:auto}
/* 터치·클릭은 화면 전체에서 받는다(플레이 영역 밖을 눌러도 가장 가까운 레인으로 처리되던 기존 동작 유지) */
#hit{position:fixed;inset:0;touch-action:none}
/* 점수·진행 바: 값이 바뀔 때만 갱신되는 HTML 요소 */
#hud{position:fixed;inset:0;pointer-events:none}
#hudBar{position:absolute;left:0;top:0;width:100%;height:4px;background:rgba(255,255,255,.12);overflow:hidden}
#hudFill{position:absolute;inset:0;transform-origin:0 0;transform:scaleX(0);will-change:transform}
#hudScore{position:absolute;right:14px;top:17px;font:800 22px/22px system-ui,sans-serif;color:#fff}
#hudDiff{position:absolute;right:14px;top:46px;font:800 12px/12px system-ui,sans-serif}
#overFx{position:fixed;inset:0;background:rgba(20,0,10,.55);opacity:0;pointer-events:none;transition:opacity .4s}
#overFx b{position:absolute;left:50%;top:42%;transform:translate(-50%,-80%);font:900 56px/1 system-ui,sans-serif;color:#ff4d6d;white-space:nowrap}
#overFx.on{opacity:1}
#overFx.on b{animation:ovIn .4s both}
@keyframes ovIn{from{transform:translate(-50%,-80%) scale(.72)}to{transform:translate(-50%,-80%) scale(1)}}
/* 느린 기기(자동 품질 1단계 이상): 화면 전체를 매 프레임 다시 합치게 만드는 배경 움직임을 멈춘다 */
.lowfx canvas.stars{animation:none}
.lowfx #danger.on{animation:none;opacity:.17}
#dbg{position:fixed;left:58px;top:calc(14px + env(safe-area-inset-top));z-index:6;font-size:11px;font-weight:700;padding:3px 8px;border-radius:8px;background:rgba(0,0,0,.55);pointer-events:none;font-variant-numeric:tabular-nums}
.ov{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;background:rgba(5,3,15,.8);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);text-align:center;padding:16px;overflow:auto;z-index:10;touch-action:pan-y}
.hidden{display:none!important}
.logo{font-size:clamp(28px,7vw,46px);font-weight:900;letter-spacing:-1px;background:linear-gradient(90deg,#3ee6ff,#ffd23e,#ff3d7f);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 18px rgba(62,230,255,.35))}
.sub{font-size:12px;opacity:.7;margin-top:-6px}
.songs{display:flex;flex-direction:column;gap:6px;width:min(460px,94vw);max-height:36vh;overflow:auto;touch-action:pan-y;padding:2px}
.song{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 14px;border-radius:14px;background:rgba(255,255,255,.05);border:2px solid transparent;cursor:pointer;text-align:left;color:#fff;font:inherit}
.song.sel{border-color:#3ee6ff;background:rgba(62,230,255,.1)}
.song b{font-size:15px}
.song small{display:block;font-size:11px;opacity:.65;margin-top:2px}
.lvls{display:flex;gap:4px;flex-shrink:0}
.lvls i{font-style:normal;font-size:11px;font-weight:800;width:24px;height:22px;line-height:22px;border-radius:6px;background:rgba(255,255,255,.08);text-align:center}
.diffs{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.diff{width:124px;padding:10px 6px;border-radius:14px;border:2px solid rgba(255,255,255,.15);background:rgba(255,255,255,.05);color:#fff;cursor:pointer;font:inherit;transition:.15s}
.diff b{display:block;font-size:15px;letter-spacing:1px}
.diff small{display:block;opacity:.7;font-size:11px;margin-top:2px}
.diff.sel{transform:translateY(-3px)}
.row{display:flex;align-items:center;gap:10px;font-size:14px}
.row span{width:72px;text-align:right;opacity:.8}
.row b{width:64px}
.sbtn{width:34px;height:34px;border-radius:50%;border:none;background:rgba(255,255,255,.12);color:#fff;font-size:20px;cursor:pointer}
.big{padding:13px 42px;border-radius:999px;border:none;font:inherit;font-size:18px;font-weight:800;color:#120a2a;background:linear-gradient(90deg,#3ee6ff,#ffd23e);cursor:pointer;box-shadow:0 0 30px rgba(62,230,255,.4)}
.big.alt{background:rgba(255,255,255,.12);color:#fff;box-shadow:none}
.btns{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.help{font-size:11px;opacity:.6;line-height:1.8}
kbd{display:inline-block;min-width:20px;padding:0 5px;border-radius:5px;background:rgba(255,255,255,.15);font-family:inherit;font-weight:700;margin:0 1px}
#pauseBtn{position:fixed;top:calc(10px + env(safe-area-inset-top));left:10px;width:40px;height:40px;border-radius:12px;border:none;background:rgba(255,255,255,.1);color:#fff;font-size:15px;font-weight:900;cursor:pointer;z-index:5}
.grade{font-size:90px;font-weight:900;line-height:1}
.stats{display:grid;grid-template-columns:auto auto;gap:4px 22px;font-size:15px;text-align:left}
.stats span:nth-child(odd){opacity:.7}
.badge{font-weight:900;letter-spacing:2px;color:#ffd23e;min-height:1.2em}
/* 음악 준비 화면: 화면 전체를 덮어 다른 곳을 누르거나 스크롤할 수 없게 함 */
.lm{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;background:rgba(5,3,15,.93);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);touch-action:none;overscroll-behavior:contain;cursor:wait;animation:lmIn .25s .12s both}
@keyframes lmIn{from{opacity:0}to{opacity:1}}
.lm-box{display:flex;flex-direction:column;align-items:center;gap:6px;padding:16px;text-align:center}
.lm-bubble{position:relative;max-width:min(320px,86vw);padding:14px 20px;border-radius:22px;background:#fff;color:#2a1650;font-size:15px;line-height:1.5;box-shadow:0 8px 30px rgba(62,230,255,.25);animation:lmPop .4s .15s both}
.lm-bubble>b{display:block;font-size:18px;font-weight:900;color:#ff3d7f;margin-bottom:2px}
.lm-bubble span b{color:#6b3cff}
.lm-bubble:after{content:"";position:absolute;left:50%;bottom:-12px;margin-left:-12px;border:12px solid transparent;border-bottom:0;border-top-color:#fff}
@keyframes lmPop{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}
.dots i{font-style:normal;animation:lmDot 1.2s infinite;opacity:.2}
.dots i:nth-child(2){animation-delay:.2s}.dots i:nth-child(3){animation-delay:.4s}
@keyframes lmDot{0%,60%,100%{opacity:.2}30%{opacity:1}}
.lm-char{position:relative;width:110px;height:110px;margin-top:44px;animation:lmBounce .9s ease-in-out infinite}
@keyframes lmBounce{0%,100%{transform:translateY(0) scale(1,1)}45%{transform:translateY(-16px) scale(.96,1.04)}90%{transform:translateY(0) scale(1.06,.94)}}
.lm-body{position:absolute;inset:0;border-radius:50% 50% 46% 46%;background:radial-gradient(circle at 35% 30%,#fff7b8,#ffd23e 45%,#ffa21a);box-shadow:0 0 30px rgba(255,210,62,.55),inset 0 -8px 14px rgba(255,120,0,.35)}
.lm-ant{position:absolute;left:50%;top:-30px;transform:translateX(-50%) rotate(-8deg);font-size:30px;filter:drop-shadow(0 0 8px #3ee6ff);animation:lmWig 1.8s ease-in-out infinite}
@keyframes lmWig{0%,100%{transform:translateX(-50%) rotate(-12deg)}50%{transform:translateX(-50%) rotate(12deg)}}
.lm-eye{position:absolute;top:40px;width:13px;height:17px;border-radius:50%;background:#2a1650;animation:lmBlink 3.2s infinite}
.lm-eye:after{content:"";position:absolute;top:3px;left:3px;width:5px;height:5px;border-radius:50%;background:#fff}
.lm-eye.l{left:32px}.lm-eye.r{right:32px}
@keyframes lmBlink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
.lm-cheek{position:absolute;top:62px;width:16px;height:9px;border-radius:50%;background:rgba(255,90,140,.55)}
.lm-cheek.l{left:18px}.lm-cheek.r{right:18px}
.lm-mouth{position:absolute;top:64px;left:50%;width:18px;height:10px;margin-left:-9px;border-radius:0 0 12px 12px;background:#2a1650}
.lm-shadow{width:80px;height:12px;border-radius:50%;background:rgba(0,0,0,.45);margin-top:4px;animation:lmShadow .9s ease-in-out infinite}
@keyframes lmShadow{0%,100%{transform:scaleX(1);opacity:.6}45%{transform:scaleX(.7);opacity:.3}}
.lm-bar{width:min(240px,70vw);height:8px;border-radius:99px;background:rgba(255,255,255,.12);overflow:hidden;margin-top:12px}
#lmBar{height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,#3ee6ff,#ffd23e);transition:width .25s}
.lm.err .lm-bar{display:none}
.lm.err .lm-body{filter:hue-rotate(-40deg) saturate(.8)}
/* 화면보다 내용이 길어도 위쪽이 잘리지 않고 스크롤되도록(짧으면 가운데 정렬 유지) */
.ov{justify-content:flex-start}
.ov>:first-child{margin-top:auto}
.ov>:last-child{margin-bottom:auto}
/* 타이틀: 왼쪽 곡 선택 + 오른쪽 랭킹 (좁은 화면에서는 아래로 내려감) */
#titleOv{justify-content:flex-start}
.twrap{margin:auto;display:flex;align-items:center;justify-content:center;gap:28px;flex-wrap:wrap;width:100%}
.tmain{display:flex;flex-direction:column;align-items:center;gap:12px;min-width:0}
.lb{width:min(300px,94vw);padding:14px 14px 10px;border-radius:18px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.1);text-align:left}
.lb-head{display:flex;align-items:center;justify-content:space-between;gap:8px}
.lb-head b{font-size:16px}
.lb-tg{border:none;border-radius:999px;padding:4px 12px;background:rgba(255,255,255,.1);color:#fff;font:inherit;font-size:12px;cursor:pointer}
.lb-sub{font-size:12px;font-weight:800;letter-spacing:.5px;margin:4px 0 8px}
.lb-body{min-height:260px;max-height:46vh;overflow:auto;touch-action:pan-y}
.lb.off .lb-body,.lb.off .lb-sub{display:none}
.lb-th,.lb-row{display:grid;grid-template-columns:34px 1fr auto;gap:8px;align-items:center;padding:6px 8px;font-size:14px}
.lb-th{font-size:11px;opacity:.55;padding-top:0}
.lb-row{border-radius:10px}
.lb-row:nth-child(odd){background:rgba(255,255,255,.04)}
.lb-row.me{box-shadow:inset 0 0 0 1px #3ee6ff}
.lb-rk{text-align:center;font-weight:900;opacity:.85}
.lb-nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lb-sc{font-weight:800;font-variant-numeric:tabular-nums}
.lb-msg{font-size:13px;opacity:.6;text-align:center;padding:48px 8px;line-height:1.6}
.rsub{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;align-items:center;max-width:94vw}
.rsub input{width:180px;padding:10px 14px;border-radius:999px;border:2px solid rgba(255,255,255,.2);background:rgba(255,255,255,.08);color:#fff;font:inherit;font-size:15px;outline:none;-webkit-user-select:text;user-select:text}
.rsub input:focus{border-color:#3ee6ff}
.rsub .big{padding:10px 22px;font-size:15px}
.rsub-msg{width:100%;font-size:13px;opacity:.85;min-height:1.2em}
</style>
</head>
<body>
<div id="bgBase"></div><div id="bgGlow"></div>
<canvas id="st1" class="stars"></canvas><canvas id="st2" class="stars"></canvas>
<canvas id="field" class="hidden"></canvas>
<canvas id="cv"></canvas>
<div id="danger"></div><div id="dbg" class="hidden"></div>
<div id="hud" class="hidden"><div id="hudBar"><i id="hudFill"></i></div><b id="hudScore">0</b><small id="hudDiff"></small></div>
<div id="overFx"><b>GAME OVER</b></div>
<div id="hit"></div>
<button id="pauseBtn" class="hidden">Ⅱ</button>

<div id="titleOv" class="ov">
 <div class="twrap">
  <div class="tmain">
  <div class="logo">⚡ 에너지 리듬</div>
  <div class="sub">ENERGY RHYTHM · 클래식 · 민요 · 캐럴 · 오리지널 23곡</div>
  <div id="songs" class="songs"></div>
  <div id="diffs" class="diffs"></div>
  <button id="startBtn" class="big">시작하기</button>
  <div class="help">PC <kbd>D</kbd><kbd>F</kbd><kbd>J</kbd><kbd>K</kbd> · 모바일은 레인 터치 · <kbd>Esc</kbd> 일시정지<br>⚡ 에너지 게이지가 0이 되면 게임 오버 · 노트가 없을 때 헛누르면 게이지가 깎여요</div>
  </div>
  <aside id="lb" class="lb hidden">
    <div class="lb-head"><b>🏆 랭킹 TOP 10</b><button id="lbToggle" class="lb-tg">숨기기</button></div>
    <div id="lbSub" class="lb-sub"></div>
    <div id="lbBody" class="lb-body"></div>
  </aside>
 </div>
</div>

<div id="pauseOv" class="ov hidden">
  <div class="logo" style="font-size:40px">일시정지</div>
  <div class="btns">
    <button class="big" data-a="resume">계속하기</button>
    <button class="big alt" data-a="retry">다시 하기</button>
    <button class="big alt" data-a="menu">곡 선택</button>
  </div>
</div>

<div id="resultOv" class="ov hidden">
  <div id="rSong" style="font-size:18px;font-weight:800"></div>
  <div id="rDiff" style="font-weight:800;letter-spacing:2px;margin-top:-8px"></div>
  <div id="rGrade" class="grade"></div>
  <div id="rBadge" class="badge"></div>
  <div id="rScore" style="font-size:30px;font-weight:800"></div>
  <div class="stats" id="rStats"></div>
  <div id="rSubmit" class="rsub hidden">
    <input id="rName" maxlength="12" placeholder="별명 (최대 12자)" autocomplete="off" enterkeyhint="send">
    <button id="rSend" class="big">랭킹 등록</button>
    <div id="rSubMsg" class="rsub-msg"></div>
  </div>
  <div class="btns">
    <button class="big" data-a="retry">다시 하기</button>
    <button class="big alt" data-a="menu">곡 선택</button>
  </div>
</div>

<div id="loadMsg" class="lm hidden">
  <div class="lm-box">
    <div class="lm-bubble"><b id="lmTitle">잠깐만 기다려 줘!</b><span id="lmText">음악을 만드는 중이야</span></div>
    <div class="lm-char"><span class="lm-ant">⚡</span><div class="lm-body"></div><i class="lm-eye l"></i><i class="lm-eye r"></i><i class="lm-cheek l"></i><i class="lm-cheek r"></i><i class="lm-mouth"></i></div>
    <div class="lm-shadow"></div>
    <div class="lm-bar"><div id="lmBar"></div></div>
  </div>
</div>

<script>
/* ★ 랭킹(구글 시트) 연결: Apps Script 웹 앱 주소(…/exec)를 따옴표 안에 붙여 넣으세요.
     비워 두면 랭킹 기능이 아예 숨겨집니다. */
const LB_URL = 'https://script.google.com/macros/s/AKfycbweJaoXmJsFiZYC4jyKGf4Mw2VdExrAkLtT_oz5LPn7HydHqj_0LSd3Rl2QRKBr1q-a/exec';
//SONG-START
/* ---------- 비창 오버드라이브 (원래 곡) ---------- */

const SCALE = [0, 2, 3, 5, 7, 8, 11]; // C harmonic minor
const CH = { Cm:[0,3,7], G:[7,11,2], G7:[7,11,2,5], Ab:[8,0,3], Fm:[5,8,0] };
const ARPL = [0,2,1,3,0,2,1,3,2,0,3,1,2,0,3,1];

// 비창 3악장 론도 주제를 바탕으로 한 8마디 선율 [박, MIDI, 길이(박)]
const THEME = [
  [0,72,2],[2,74,1],[3,75,1],
  [4,74,1],[5,72,1],[6,71,1],[7,72,1],
  [8,74,2],[10,67,1],[11,68,1],
  [12,67,1],[13,65,1],[14,63,1],[15,62,1],
  [16,63,1],[17,65,1],[18,67,1],[19,68,1],
  [20,67,2],[22,72,1],[23,75,1],
  [24,74,1],[25,72,1],[26,71,1],[27,74,1],
  [28,72,3],[31,67,1]
];
const THEME_H = ['Cm','G','G','Cm','Ab','Cm','G','Cm'];

function degToMidi(deg, base) { const o = Math.floor(deg / 7), i = ((deg % 7) + 7) % 7; return base + 12 * o + SCALE[i]; }
function midiToDeg(m) {
  const o = Math.floor((m - 60) / 12), pc = (((m - 60) % 12) + 12) % 12;
  let i = SCALE.indexOf(pc);
  if (i < 0) { let bd = 99; SCALE.forEach((s, k) => { const d = Math.abs(s - pc); if (d < bd) { bd = d; i = k; } }); }
  return o * 7 + i;
}
const laneOfPitch = m => ((midiToDeg(m) % 4) + 4) % 4;
const voice = name => CH[name].map(pc => 60 + pc).sort((a, b) => a - b);

function buildPathetique() {
  const ev = [], ch = [];
  const hit = (i, t, v = 1) => ev.push({ t, i, v });
  let lastRunLane = -1;

  function arp(bar, name, lvlMap, vel) {
    const v = voice(name).slice(0, 3);
    const pat = [v[0], v[2], v[1], v[2], v[0] + 12, v[2], v[1], v[2]];
    for (let i = 0; i < 16; i++) {
      const t = bar * 4 + i / 4;
      ev.push({ t, i: 'arp', m: pat[i % 8], v: vel });
      const l = lvlMap[i % 4];
      if (l < 9) ch.push({ t, lane: ARPL[i], len: 0, lvl: l });
    }
  }
  function bass(bar, name, style) {
    const r = 36 + CH[name][0], s = bar * 4;
    if (style === 'eighth') for (let k = 0; k < 8; k++) ev.push({ t: s + k / 2, i: 'bass', m: k % 2 ? r + 12 : r });
    else ev.push({ t: s, i: 'bassL', m: r, d: 4 });
  }
  function drums(bar, style) {
    const s = bar * 4;
    if (style === 'kick') { for (let k = 0; k < 4; k++) hit('kick', s + k); return; }
    if (style === 'half') { hit('kick', s); hit('kick', s + 2.5); hit('snare', s + 2); for (let k = 0; k < 8; k++) hit('hat', s + k / 2, k % 2 ? 1 : .5); return; }
    for (let k = 0; k < 4; k++) { hit('kick', s + k); if (k % 2) hit('snare', s + k); hit('hat', s + k + .5); }
    if (style === 'full') for (let k = 0; k < 4; k++) { hit('hat', s + k + .25, .6); hit('hat', s + k + .75, .6); }
    if (style === 'roll') for (let i = 0; i < 16; i++) hit('snare', s + i / 4, .3 + .7 * i / 16);
  }
  function melody(start, notes, o = {}) {
    const sc = o.stretch || 1, out = [];
    for (const [bt, m, d] of notes) {
      const t = start + bt * sc, dur = d * sc;
      ev.push({ t, i: 'lead', m, d: dur });

function tempoFns(b0, b1, beats) {
  const k = (b1 - b0) / beats;
  if (Math.abs(k) < 1e-9) return { b2s: b => b * 60 / b0, s2b: s => s * b0 / 60 };
  return { b2s: b => 60 / k * Math.log((b0 + k * b) / b0), s2b: s => b0 * (Math.exp(k * s / 60) - 1) / k };
}
function chartFor(raw, level, b2s) {
  const src = raw.slice().sort((a, b) => a.t - b.t || a.lvl - b.lvl);
  const out = [], seen = new Set(), holdEnd = [-9, -9, -9, -9];
  for (const n of src) {
    if (n.lvl > level) continue;
    const key = Math.round(n.t * 100) + '_' + n.lane;
    if (seen.has(key)) continue;
    if (n.t < holdEnd[n.lane] + .24) continue;
    seen.add(key);
    const time = b2s(n.t), end = b2s(n.t + n.len);
    out.push({ time, lane: n.lane, len: end - time, end });
    if (n.len > 0) holdEnd[n.lane] = n.t + n.len;
  }
  return out;
}

function spreadLanes(chart) {
  const a = chart.slice().sort((x, y) => x.time - y.time || x.lane - y.lane);
  const busy = [-9, -9, -9, -9]; // 레인별로 롱노트가 끝나는 시각
  let last = -1, lt = -9, dir = 1;
  for (let i = 0; i < a.length; i++) {
    const n = a[i];
    const multi = (a[i - 1] && Math.abs(a[i - 1].time - n.time) < 1e-6) || (a[i + 1] && Math.abs(a[i + 1].time - n.time) < 1e-6);
    if (!multi && n.lane === last && n.time - lt < .6) {
      let l = last + dir;
      if (l < 0 || l > 3) { dir = -dir; l = last + dir; }
      if (busy[l] > n.time - .05) { const alt = last - dir; if (alt >= 0 && alt <= 3 && busy[alt] <= n.time - .05) l = alt; else l = n.lane; }
      n.lane = l;
    }
    if (n.len > 0) busy[n.lane] = n.end;
    last = multi ? -1 : n.lane; lt = n.time;
  }

}

function easeJacks(chart, gap) {
  const a = chart.slice().sort((x, y) => x.time - y.time), out = [], lastEnd = [-9, -9, -9, -9];
  for (let i = 0; i < a.length; i++) {
    const n = a[i];
    if (n.time - lastEnd[n.lane] < gap) {
      const busy = a.filter(m => Math.abs(m.time - n.time) < 1e-6).map(m => m.lane);
      let to = -1;
      for (let l = 0; l < 4 && to < 0; l++) {

});

// (x, y)는 기존 fillText와 같은 기준점(정렬 기준 x, 글자 기준선 y), s는 크기 배율

};
const JSPR = { P: new TextSpr('900 41px system-ui', 41, 'center'), GR: new TextSpr('900 41px system-ui', 41, 'center'), GD: new TextSpr('900 41px system-ui', 41, 'center'), M: new TextSpr('900 41px system-ui', 41, 'center') };

let lastFrame = performance.now();

const DEBUG = /[?&]debug\b/.test(location.search);

function frame(now) {

  const dt = Math.min(50, raw) / 16.67; lastFrame = now;

  const energy = S_ && active ? Math.min(S_.combo / 150, 1) : .3;
  // 느린 기기(품질 1단계 이상)에서는 박자 펄스를 빼고 콤보에 따른 밝기만 큰 단위로 바꾼다(화면 전체 재합성 횟수 감소)
  const fullFx = q === 0;
  const glow = fullFx ? Math.round((.32 * energy + .14 * pulse) / .46 * 100) / 100 : Math.round(.32 * energy / .46 * 10) / 10;
  if (glow !== lastGlow) { bgGlow.style.opacity = glow; lastGlow = glow; }
  if (fullFx || lastStar[0] !== lastStar[0]) {
    const drift = active ? Math.max(t, 0) * 40 : now / 1000 * 8;
    for (let i = 0; i < 2; i++) {
      const v = Math.round(((drift * starSp[i]) % H - H) * 2) / 2;
      if (v !== lastStar[i]) { starCv[i].style.transform = `translate3d(0,${v}px,0)`; lastStar[i] = v; }
    }
  }
  if (active !== lastActive) { fieldCv.classList.toggle('hidden', !active); hudEl.classList.toggle('hidden', !active); lastActive = active; }
  const danger = !!(active && state === 'play' && S_ && S_.gauge <= 25);
  if (danger !== lastDanger) { dangerEl.classList.toggle('on', danger); lastDanger = danger; }
  if (active && lanesQ) { g.clearRect(FX0, 0, FW, H); drawField(t, dt, pulse); drewLast = true; }
  else if (drewLast) { g.clearRect(FX0, 0, FW, H); drewLast = false; }
  // 자동 품질 조절: 카운트다운이 끝난 뒤 2초 동안의 평균 프레임 간격이 26ms(약 38fps)보다 길면 해상도를 한 단계 낮춘다
  if (state === 'play' && st > 1 && raw < 250) {
    perfAcc += raw; perfN++;

      if (perfAcc / perfN > 26 && q < 2) { q++; store.set('q', q); resize(); }

}
function drawField(t, dt, pulse) {
  const pps = H * .18 * speed;
  for (let l = 0; l < 4; l++) {
    const a = Math.max(laneFlash[l], laneDown[l] > 0 ? .55 : 0);
    if (a > .01) { g.globalAlpha = a; g.drawImage(laneGlow[l], colX + l * laneW, judgeY - H * .55, laneW, H * .55); }
    laneFlash[l] *= Math.pow(.85, dt);

  for (let b = Math.max(0, Math.floor(cur.s2b(Math.max(t, 0)) / bb)); b <= nBars; b++) {

      const n = q[i], y = judgeY - (n.time - t) * pps;

        const ye = judgeY - (n.end - t) * pps, yh = holding ? judgeY : y;
        g.fillStyle = LC[l];
        g.globalAlpha = holding ? .55 : .3; g.fillRect(x + w * .12, ye, w * .76, yh - ye);
        g.globalAlpha = .9; g.fillRect(x + w * .12, ye - 3, w * .76, 6);
        g.globalAlpha = 1;
        drawNote(x, yh, w, nh, l);
        if (holding && Math.random() < .5) addParticle(x + Math.random() * w, judgeY, (Math.random() - .5) * 2, -Math.random() * 4 - 1, .7, LC[l]);
      } else drawNote(x, y, w, nh, l);
    }
  }
  // 판정선
  g.fillStyle = judgeGrad; g.globalAlpha = .75 + .25 * pulse; g.fillRect(colX, judgeY - 2, colW, 4); g.globalAlpha = 1;
  g.font = '700 16px system-ui'; g.textAlign = 'center'; g.lineWidth = 3;
  for (let l = 0; l < 4; l++) {
    const cx = colX + (l + .5) * laneW;
    if (laneDown[l] > 0) { g.fillStyle = LC[l]; g.globalAlpha = .25; g.fillRect(colX + l * laneW, judgeY + 2, laneW, H - judgeY); g.globalAlpha = 1; }
    if (ringFx[l] > .01) {
      g.strokeStyle = LC[l]; g.globalAlpha = ringFx[l];
      g.beginPath(); g.arc(cx, judgeY, laneW * (.55 - ringFx[l] * .3), 0, Math.PI * 2); g.stroke();
      g.globalAlpha = 1;
      ringFx[l] *= Math.pow(.86, dt);
    }
  }
  // 파티클 (배열 재배치 없이 끝 원소와 바꿔 제거)
  for (let i = pN - 1; i >= 0; i--) {
    const p = PPOOL[i];
    p.x += p.vx * dt; p.y += p.vy * dt; p.vy += .25 * dt; p.life -= .035 * dt;
    if (p.life <= 0) { PPOOL[i] = PPOOL[pN - 1]; PPOOL[pN - 1] = p; pN--; continue; } // 끝 원소와 자리만 바꿔 반납
    g.globalAlpha = p.life; g.fillStyle = p.c; g.fillRect(p.x - 2, p.y - 2, 4, 4);
  }
  g.globalAlpha = 1;
  // 판정 & 콤보
  g.textAlign = 'center';
  if (judgeFx) {
    const age = performance.now() - judgeFx.t;
    if (age < 500) {
      const jt = JTXT[judgeFx.k], sc = 1 + .35 * Math.max(0, 1 - age / 90);
      g.globalAlpha = age > 300 ? 1 - (age - 300) / 200 : 1;
      JSPR[judgeFx.k].set(jt[0], jt[1]).draw(W / 2, judgeY - H * .26, sc / 1.35);
      g.globalAlpha = 1;
    }
  }
  if (S_.combo >= 3) {
    comboSpr.set(S_.combo, 'rgba(255,255,255,.9)').draw(W / 2, judgeY - H * .36);
    comboLbl.set('COMBO', 'rgba(255,255,255,.55)').draw(W / 2, judgeY - H * .36 + 20);
  }
  if (state === 'resume') cdSpr.set(Math.max(1, Math.ceil(pauseT - t)), 'rgba(255,255,255,.85)').draw(W / 2, H * .4);
  else if (t < 0) {
    cdSpr.set(Math.ceil(-t), 'rgba(255,255,255,.85)').draw(W / 2, H * .4);
    titleSpr.set(cur.title, 'rgba(255,255,255,.7)').draw(W / 2, H * .4 + 34);
  }
  // 에너지 게이지
  const gv = S_.gauge / 100, gx = colX + colW + 14 + 12 <= W ? colX + colW + 6 : colX + colW - 14;
  const gTop = H * .14, gH = judgeY - gTop;
  g.fillStyle = 'rgba(255,255,255,.1)'; rr(gx, gTop, 10, gH, 5);
  const gcol = gv > .5 ? '#5effa1' : gv > .25 ? '#ffd23e' : '#ff4d6d';
  if (gv > 0) { g.fillStyle = gcol; g.globalAlpha = gv <= .25 ? .6 + .4 * Math.abs(Math.sin(performance.now() / 120)) : 1; rr(gx, gTop + gH * (1 - gv), 10, gH * gv, 5); g.globalAlpha = 1; }

  gaugeSpr.draw(gx + 5, gTop - 8);

  if (S_.w !== scoreW) { scoreW = S_.w; hudScore.textContent = fmt(Math.round(S_.w / S_.total * 1e6)); }
  const pw = Math.round(Math.max(0, Math.min(1, t / cur.end)) * 1000);
  if (pw !== lastPw) { hudFill.style.transform = `scaleX(${pw / 1000})`; lastPw = pw; }
}
function drawNote(x, y, w, h, l) { g.drawImage(noteSpr[l], x - NP, y - h / 2 - NP, w + NP * 2, h + NP * 2); }
requestAnimationFrame(frame);
</script>
